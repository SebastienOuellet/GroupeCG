<header class="topbar">
  <img class="topbar__logo" src="images/logo.png" alt="Groupe CG" />
  <button type="button" class="btn-secondary" (click)="logout()">Déconnexion</button>
</header>

<main class="content">
  @if (me(); as user) {
    <h1>Bienvenue, {{ user.Name || user.Email }}</h1>
    <p>Rôle: {{ user.Role }}</p>
  } @else {
    <p>Chargement...</p>
  }
</main>
