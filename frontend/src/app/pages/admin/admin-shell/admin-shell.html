<div class="shell" [class.shell--menu-open]="menuOpen()">
  <!-- Barre du haut : visible seulement sur mobile/tablette (menu repliable) -->
  <header class="topbar">
    <button
      type="button"
      class="topbar__menu"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-sidebar"
      aria-label="Ouvrir le menu"
    >
      <span></span><span></span><span></span>
    </button>
    <img class="topbar__logo" src="images/logo.png" alt="Groupe CG" />
    <span class="topbar__title">Groupe CG</span>
  </header>

  <div class="backdrop" (click)="closeMenu()" aria-hidden="true"></div>

  <aside id="admin-sidebar" class="sidebar">
    <img class="sidebar__logo" src="images/logo.png" alt="Groupe CG" />

    <nav class="sidebar__nav">
      <a routerLink="/clients" routerLinkActive="active">Clients</a>
      <a routerLink="/contrats" routerLinkActive="active">Contrats</a>
      <a routerLink="/routes" routerLinkActive="active">Routes</a>
      <a routerLink="/notifications" routerLinkActive="active">Notifications</a>
      <a routerLink="/modeles" routerLinkActive="active">Modèles</a>
      <a routerLink="/factures" routerLinkActive="active">Factures</a>
      <a routerLink="/parametres" routerLinkActive="active">Paramètres</a>
    </nav>

    <div class="sidebar__footer">
      @if (dbUser(); as user) {
        <span class="sidebar__user">{{ user.Name || user.Email }}</span>
      }
      <button type="button" class="btn-secondary" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
